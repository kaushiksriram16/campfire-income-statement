name: Verify backend and frontend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test accounting and API
        working-directory: backend
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare backend virtual environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check all dependency advisories
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Check production dependency advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Test frontend components and formatter
        working-directory: frontend
        run: npm test
      - name: TypeScript check and production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real browser-to-API smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Check root startup script
        run: |
          set -e
          node scripts/dev.mjs >/tmp/campfire-dev.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1 && curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/campfire-dev.log; exit 1; fi
          curl -fsS 'http://127.0.0.1:5173/income-statement?start=2026-01-01&end=2026-03-31' | grep -q -- '-44480.14'
          kill -TERM "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          # Both servers must terminate after the startup script exits.
          for attempt in $(seq 1 10); do
            if ! curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1 && ! curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campfire-dev.log
          echo "Development server processes remained after stop"
          exit 1
