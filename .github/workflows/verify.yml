name: Verify backend and frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test API and accounting
        working-directory: backend
        run: python -m pytest -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use npm 11 to resolve Vitest optional peers
        run: npm install --global npm@11
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Emit generated lockfile for version-controlled reproducibility
        working-directory: frontend
        run: |
          echo 'BEGIN_LOCKFILE_B64'
          base64 -w 80 package-lock.json
          echo 'END_LOCKFILE_B64'
      - name: Inspect production and development advisories
        working-directory: frontend
        run: |
          npm audit --json > /tmp/full-audit.json || true
          npm audit --omit=dev --json > /tmp/prod-audit.json || true
          node -e 'for (const [label,file] of [["full","/tmp/full-audit.json"],["production","/tmp/prod-audit.json"]]) { const data=require(file); console.log(label+" audit totals: "+JSON.stringify(data.metadata?.vulnerabilities)); for (const [name,item] of Object.entries(data.vulnerabilities||{})) console.log(JSON.stringify({scope:label,name,severity:item.severity,isDirect:item.isDirect,range:item.range,via:item.via,fixAvailable:item.fixAvailable})); }'
      - name: Test UI controls
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
